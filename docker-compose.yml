services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: "8080"
      VIDTUBE_DATA: /var/lib/vidtube
    ports:
      - "8080:8080"
    volumes:
      - vidtube-data:/var/lib/vidtube

volumes:
  vidtube-data:
